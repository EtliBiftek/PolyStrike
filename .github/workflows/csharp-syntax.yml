name: C# Syntax Check

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore syntax checker
        run: dotnet restore Tools/SyntaxCheck/SyntaxCheck.csproj

      - name: Check C# syntax
        run: dotnet run --project Tools/SyntaxCheck/SyntaxCheck.csproj -- "$GITHUB_WORKSPACE"
